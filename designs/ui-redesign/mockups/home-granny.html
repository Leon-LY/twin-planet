<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双宝记 · 首页·奶奶</title>
<style>
  :root {
    --bg:#FDFAF3;--surface:#FFF7EC;--elevated:#FFFFFF;
    --baby-a:#E07B3E;--baby-b:#D48068;
    --ink:#2A2017;--ink-md:#948570;
    --success:#5C9A6E;--warning:#C8993E;
    --border:#EADFCB;
    --shadow-md:0 4px 16px rgba(42,32,23,0.08);
    --shadow-lg:0 8px 32px rgba(42,32,23,0.12);
    --shadow-baby-a:0 4px 20px rgba(224,123,62,0.20);
    --shadow-baby-b:0 4px 20px rgba(212,128,104,0.20);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  
  body{
    background:#E8E2D4;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:40px;font-family:'PingFang SC','Microsoft YaHei',sans-serif
  }
  
  .phone{width:390px;height:844px;background:var(--bg);border-radius:48px;overflow:hidden;position:relative;box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 13px #333,
    0 24px 60px rgba(0,0,0,0.25)
  }

  .statusbar{height:44px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px}
  .statusbar span{font-size:15px;font-weight:700;color:var(--ink)}

  .page-content{height:calc(844 - 44 - 80px);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:24px}

  /* 奶奶模式：超大字、高对比 */
  .greeting{text-align:center;margin-bottom:4px}
  .greeting h1{font-family:'Source Han Serif SC','Songti SC',serif;font-size:36px;font-weight:400;line-height:1.2;color:var(--ink)}
  .greeting p{font-size:18px;color:var(--ink-md);margin-top:6px}

  /* Baby avatars - large and centered for granny mode */
  .babies-row{display:flex;justify-content:center;gap:24px}
  .baby-avatar-granny{display:flex;flex-direction:column;align-items:center;gap:10px}
  .avatar-circle{width:90px;height:90px;border-radius:50%;padding:3px;position:relative}
  .avatar-a-bg{background:linear-gradient(135deg,#F4C9A8,#E07B3E);box-shadow:var(--shadow-baby-a)}
  .avatar-b-bg{background:linear-gradient(135deg,#EBCCBF,#D48068);box-shadow:var(--shadow-baby-b)}
  .avatar-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .avatar-name{font-size:22px;font-weight:600;text-align:center}

  /* 3 Big Buttons - Granny's main interface */
  .big-buttons{display:flex;flex-direction:column;gap:20px;flex:1}
  .big-btn{border:none;border-radius:24px;padding:28px 20px;font-size:24px;font-weight:700;
    color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;cursor:default;transition:transform 0.1s
  }
  .big-btn:active{transform:scale(0.97)}
  .btn-feed{
    background:linear-gradient(180deg,rgba(255,255,255,0.18),rgba(0,0,0,0.04),transparent),#E07B3E;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),0 5px 0 #B85F28,0 6px 20px rgba(224,123,62,0.25)
  }
  .btn-sleep{
    background:linear-gradient(180deg,rgba(255,255,255,0.18),rgba(0,0,0,0.04),transparent),#D48068;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),0 5px 0 #A85543,0 6px 20px rgba(212,128,104,0.25)
  }
  .btn-growth{
    background:linear-gradient(180deg,rgba(255,255,255,0.18),rgba(0,0,0,0.04),transparent),#5C9A6E;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),0 5px 0 #457A52,0 6px 20px rgba(92,154,110,0.25)
  }

  .big-btn-emoji{font-size:36px;line-height:1}
  .big-btn-text{text-align:left}
  .big-btn-sub{font-size:14px;opacity:0.85;font-weight:500}

  /* Quick summary card */
  .summary-card{background:var(--elevated);border-radius:18px;padding:18px;border:2px solid var(--border)}
  .summary-title{font-size:17px;font-weight:600;margin-bottom:12px;text-align:center}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .summary-item{background:var(--surface);border-radius:12px;padding:14px;text-align:center;border:1.5px solid var(--border)}
  .summary-label{font-size:13px;color:var(--ink-md);margin-bottom:4px}
  .summary-value{font-size:26px;font-weight:700;color:var(--ink)}

  /* Bottom nav - larger touch targets */
  .bottom-nav{position:absolute;bottom:0;left:0;right:0;height:88px;background:var(--elevated);border-top:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0)
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 20px;border-radius:14px;cursor:default}
  .nav-item.active{background:rgba(92,154,110,0.08)}
  .nav-icon{font-size:28px}
  .nav-label{font-size:13px;color:var(--ink-md);font-weight:500}
  .nav-item.active .nav-label{color:var(--success);font-weight:700}

  /* Fox mascot at bottom of content area */
  .mascot-area{text-align:center;margin-top:auto}
  .mascot-img{width:120px;height:120px;object-fit:contain}
  .mascot-text{font-size:13px;color:var(--ink-md);margin-top:4px}
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar"><span>09:41</span><span>●●●●●</span></div>

  <div class="page-content">
    
    <!-- Greeting -->
    <div class="greeting">
      <h1>奶奶您好 👵</h1>
      <p>宁宁和然然今天很乖哦</p>
    </div>

    <!-- Large baby avatars -->
    <div class="babies-row">
      <div class="baby-avatar-granny">
        <div class="avatar-circle avatar-a-bg"><img src="../illustration/generated/planet-baby-a.png" alt="宁宁"/></div>
        <span class="avatar-name">宁宁</span>
      </div>
      <div class="baby-avatar-granny">
        <div class="avatar-circle avatar-b-bg"><img src="../illustration/generated/planet-baby-b.png" alt="然然"/></div>
        <span class="avatar-name">然然</span>
      </div>
    </div>

    <!-- 3 Big Buttons (Granny's core interface) -->
    <div class="big-buttons">
      <button class="big-btn btn-feed">
        <span class="big-btn-emoji">🍼</span>
        <div><div class="big-btn-text">记喂养</div><div class="big-btn-sub">喂奶 / 换尿布</div></div>
      </button>
      <button class="big-btn btn-sleep">
        <span class="big-btn-emoji">😴</span>
        <div><div class="big-btn-text">记睡觉</div><div class="big-btn-sub">小睡 / 夜觉</div></div>
      </button>
      <button class="big-btn btn-growth">
        <span class="big-btn-emoji">📏</span>
        <div><div class="big-btn-text">看看长多高了</div><div class="big-btn-sub">生长曲线</div></div>
      </button>

      <!-- Summary -->
      <div class="summary-card" style="margin-top:8px">
        <div class="summary-title">今天的情况</div>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-value" style="color:var(--baby-a)">7 次</div>
            <div class="summary-label">大宝喂奶</div>
          </div>
          <div class="summary-item">
            <div class="summary-value" style="color:var(--baby-b)">6 次</div>
            <div class="summary-label">小宝喂奶</div>
          </div>
          <div class="summary-item">
            <div class="summary-value">13h</div>
            <div class="summary-label">大宝睡眠</div>
          </div>
          <div class="summary-item">
            <div class="summary-value">14h</div>
            <div class="summary-label">小宝睡眠</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Fox mascot -->
    <div class="mascot-area">
      <img src="../illustration/generated/fox-amber.png" class="mascot-img" alt="狐狸"/>
      <div class="mascot-text">奶奶辛苦啦 🧡</div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🍼</span>
      <span class="nav-label">记一记</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📏</span>
      <span class="nav-label">长高高</span>
    </div>
  </div>
</div>

</body>
</html>
