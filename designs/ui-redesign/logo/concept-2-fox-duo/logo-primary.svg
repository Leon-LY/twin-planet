<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#FFF7EC"/>
      <stop offset="100%" stop-color="#FDFAF3"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bgGlow2)" opacity="0.5"/>

  <!-- Left fox (Baby A - Amber) -->
  <g>
    <!-- Body -->
    <ellipse cx="75" cy="115" rx="28" ry="32" fill="#E07B3E"/>
    <!-- Head -->
    <circle cx="75" cy="78" r="22" fill="#E07B3E"/>
    <!-- Left ear -->
    <path d="M 60 65 L 54 48 L 68 60 Z" fill="#E07B3E"/>
    <!-- Right ear -->
    <path d="M 90 65 L 96 48 L 82 60 Z" fill="#E07B3E"/>
    <!-- Ear inner -->
    <path d="M 60 62 L 57 53 L 65 59 Z" fill="#B85F28"/>
    <path d="M 90 62 L 93 53 L 85 59 Z" fill="#B85F28"/>
    <!-- Face (pointing left, away from center) -->
    <circle cx="66" cy="76" r="3" fill="#2A2017"/>
    <!-- Snout -->
    <ellipse cx="62" cy="84" rx="5" ry="4" fill="#FFF7EC"/>
    <circle cx="59" cy="83" r="2" fill="#2A2017"/>
    <!-- Tail (pointing left, curling up) -->
    <path d="M 55 120 Q 38 110, 36 90 Q 35 78, 42 72 Q 48 70, 50 78 Q 48 90, 52 100 Q 56 112, 60 118 Z" fill="#E07B3E"/>
    <ellipse cx="40" cy="78" rx="6" ry="8" fill="#FFF7EC" opacity="0.8"/>
  </g>

  <!-- Right fox (Baby B - Rose) - mirrored -->
  <g>
    <!-- Body -->
    <ellipse cx="125" cy="115" rx="28" ry="32" fill="#D48068"/>
    <!-- Head -->
    <circle cx="125" cy="78" r="22" fill="#D48068"/>
    <!-- Right ear -->
    <path d="M 140 65 L 146 48 L 132 60 Z" fill="#D48068"/>
    <!-- Left ear -->
    <path d="M 110 65 L 104 48 L 118 60 Z" fill="#D48068"/>
    <!-- Ear inner -->
    <path d="M 140 62 L 143 53 L 135 59 Z" fill="#A85543"/>
    <path d="M 110 62 L 107 53 L 115 59 Z" fill="#A85543"/>
    <!-- Face (pointing right, away from center) -->
    <circle cx="134" cy="76" r="3" fill="#2A2017"/>
    <!-- Snout -->
    <ellipse cx="138" cy="84" rx="5" ry="4" fill="#FFF7EC"/>
    <circle cx="141" cy="83" r="2" fill="#2A2017"/>
    <!-- Tail (pointing right, curling up) -->
    <path d="M 145 120 Q 162 110, 164 90 Q 165 78, 158 72 Q 152 70, 150 78 Q 152 90, 148 100 Q 144 112, 140 118 Z" fill="#D48068"/>
    <ellipse cx="160" cy="78" rx="6" ry="8" fill="#FFF7EC" opacity="0.8"/>
  </g>

  <!-- Heart formed in negative space between their backs -->
  <path d="M 100 95
           C 95 88, 88 86, 85 92
           C 82 98, 86 104, 92 108
           L 100 116
           L 108 108
           C 114 104, 118 98, 115 92
           C 112 86, 105 88, 100 95 Z"
        fill="#C8993E" opacity="0.5"/>
</svg>
