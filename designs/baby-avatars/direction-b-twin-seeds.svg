<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs><style>
    .title { font-family: sans-serif; font-size: 11px; fill: #2D2318; font-weight: bold; }
    .label { font-family: sans-serif; font-size: 9px; fill: #9C8E7C; text-anchor: middle; }
    .amber { fill: #E07B3E; }
    .rose { fill: #D48068; }
    .paper { fill: #FEF9F0; }
    .ink { fill: #2D2318; }
    .mint { fill: #5C9A6E; }
  </style></defs>

  <!-- Direction B: Twin Seeds (并蒂而生) -->
  <text x="15" y="18" class="title">B: 并蒂种子 (Twin Seeds)</text>

  <!-- 大宝 - Larger seed, protective curve -->
  <g transform="translate(65,95)">
    <!-- Seed body -->
    <path d="M0 -20 Q12 -18 14 -5 Q15 8 8 18 Q0 22 -8 18 Q-15 8 -14 -5 Q-12 -18 0 -20Z" class="amber"/>
    <!-- Inner highlight -->
    <path d="M-4 -12 Q2 -14 6 -8 Q8 -2 4 8 Q0 12 -2 10 Q2 4 0 -6 Q-2 -12 -4 -12Z" fill="#FFF" opacity="0.15"/>
    <!-- Eye -->
    <circle cx="-1" cy="-2" r="2.5" class="paper"/>
    <!-- Small leaf/sprout on top -->
    <path d="M4 -18 Q10 -24 6 -28 Q4 -24 4 -18Z" class="mint"/>
  </g>
  <text x="65" y="140" class="label">大宝 · Amber</text>

  <!-- 小宝 - Smaller seed, playful curve -->
  <g transform="translate(205,95)">
    <path d="M0 -16 Q10 -14 12 -3 Q13 8 6 15 Q0 18 -6 15 Q-12 8 -11 -3 Q-9 -14 0 -16Z" class="rose"/>
    <path d="M-3 -9 Q2 -11 5 -5 Q7 0 3 6 Q0 9 -1 7 Q2 3 0 -4 Q-1 -9 -3 -9Z" fill="#FFF" opacity="0.15"/>
    <!-- Eye (slightly tilted - playful) -->
    <circle cx="1" cy="-1" r="2" class="paper"/>
    <circle cx="3" cy="-1.5" r="0.7" class="paper"/>
    <!-- Sprout (smaller) -->
    <path d="M3 -14 Q8 -18 5 -21 Q3 -18 3 -14Z" class="mint"/>
    <!-- Sparkle -->
    <circle cx="14" cy="-12" r="1" fill="#C8993E"/>
  </g>
  <text x="205" y="140" class="label">小宝 · Rose</text>
</svg>
