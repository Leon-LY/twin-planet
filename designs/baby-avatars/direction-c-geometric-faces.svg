<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs><style>
    .title { font-family: sans-serif; font-size: 11px; fill: #2D2318; font-weight: bold; }
    .label { font-family: sans-serif; font-size: 9px; fill: #9C8E7C; text-anchor: middle; }
  </style></defs>

  <!-- Direction C: Geometric Faces -->
  <text x="15" y="18" class="title">C: 几何面孔 (Geometric Faces)</text>

  <!-- 大宝 - Round face with gentle geometry -->
  <g transform="translate(65,95)">
    <circle cx="0" cy="0" r="22" fill="#E07B3E"/>
    <!-- Eyes - two simple dots -->
    <circle cx="-7" cy="-3" r="2.8" fill="#FEF9F0"/>
    <circle cx="7" cy="-3" r="2.8" fill="#FEF9F0"/>
    <!-- Nose - tiny triangle -->
    <path d="M0 -1 L1.5 2 L-1.5 2Z" fill="#FEF9F0" opacity="0.5"/>
    <!-- Gentle curved smile -->
    <path d="M-6 5 Q0 11 6 5" fill="none" stroke="#FEF9F0" stroke-width="2" stroke-linecap="round"/>
    <!-- Hair/top curl - protective older sibling -->
    <path d="M-8 -18 Q-6 -26 0 -24 Q6 -26 8 -18" fill="none" stroke="#E07B3E" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>
  <text x="65" y="140" class="label">大宝 · Amber</text>

  <!-- 小宝 - Slightly smaller, playful asymmetry -->
  <g transform="translate(205,95)">
    <circle cx="0" cy="0" r="20" fill="#D48068"/>
    <!-- Eyes - one slightly bigger (mischievous) -->
    <circle cx="-5" cy="-2" r="2.5" fill="#FEF9F0"/>
    <circle cx="6" cy="-2" r="2" fill="#FEF9F0"/>
    <!-- Playful open smile -->
    <path d="M-4 4 Q0 8 4 4" fill="none" stroke="#FEF9F0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Single curl - playful -->
    <path d="M0 -20 Q4 -28 8 -24" fill="none" stroke="#D48068" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Rosy cheek -->
    <circle cx="-8" cy="3" r="2" fill="#FFF" opacity="0.2"/>
  </g>
  <text x="205" y="140" class="label">小宝 · Rose</text>
</svg>
