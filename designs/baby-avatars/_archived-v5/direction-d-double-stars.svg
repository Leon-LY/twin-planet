<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs><style>
    .title { font-family: sans-serif; font-size: 11px; fill: #2D2318; font-weight: bold; }
    .label { font-family: sans-serif; font-size: 9px; fill: #9C8E7C; text-anchor: middle; }
  </style></defs>

  <!-- Direction D: Double Stars -->
  <text x="15" y="18" class="title">D: 双子星 (Twin Stars)</text>

  <!-- 大宝 - Larger star, warm amber -->
  <g transform="translate(65,95)">
    <!-- Main star shape -->
    <path d="M0 -22 L4 -8 L18 -8 L7 1 L11 15 L0 7 L-11 15 L-7 1 L-18 -8 L-4 -8Z" fill="#E07B3E"/>
    <!-- Inner highlight star -->
    <path d="M0 -14 L2 -5 L11 -5 L4 1 L6 9 L0 4 L-6 9 L-4 1 L-11 -5 L-2 -5Z" fill="#FEF9F0" opacity="0.3"/>
    <!-- Center dot -->
    <circle cx="0" cy="-2" r="2" fill="#FEF9F0"/>
  </g>
  <text x="65" y="140" class="label">大宝 · Amber</text>

  <!-- 小宝 - Smaller star, playful rose + small orbiting dot -->
  <g transform="translate(205,95)">
    <path d="M0 -18 L3 -6 L15 -6 L6 1 L9 12 L0 6 L-9 12 L-6 1 L-15 -6 L-3 -6Z" fill="#D48068"/>
    <path d="M0 -10 L1.5 -3 L8 -3 L3 1 L4 7 L0 3 L-4 7 L-3 1 L-8 -3 L-1.5 -3Z" fill="#FEF9F0" opacity="0.3"/>
    <!-- Orbiting companion dot -->
    <circle cx="16" cy="-10" r="2.5" fill="#C8993E" opacity="0.6"/>
    <path d="M8 5 Q14 -2 16 -8" fill="none" stroke="#C8993E" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5"/>
  </g>
  <text x="205" y="140" class="label">小宝 · Rose</text>
</svg>
