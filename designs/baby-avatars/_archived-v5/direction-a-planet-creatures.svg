<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs><style>
    .title { font-family: sans-serif; font-size: 11px; fill: #2D2318; font-weight: bold; }
    .label { font-family: sans-serif; font-size: 9px; fill: #9C8E7C; text-anchor: middle; }
    .amber { fill: #E07B3E; }
    .amber-lt { fill: rgba(224,123,62,0.15); }
    .rose { fill: #D48068; }
    .rose-lt { fill: rgba(212,128,104,0.15); }
    .paper { fill: #FEF9F0; }
    .ink { fill: #2D2318; }
    .mint { fill: #5C9A6E; }
  </style></defs>

  <!-- Direction A: Planet Creatures -->
  <text x="15" y="18" class="title">A: 星球生物 (Planet Creatures)</text>

  <!-- 大宝 - Planet with ring + warm smile -->
  <g transform="translate(65,95)">
    <!-- Planet body -->
    <circle cx="0" cy="0" r="22" class="amber"/>
    <!-- Ring/halo -->
    <ellipse cx="0" cy="0" rx="34" ry="8" fill="none" stroke="#E07B3E" stroke-width="2.5" opacity="0.3"
             stroke-dasharray="4 4" transform="rotate(-20)"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-3" r="2.5" class="paper"/>
    <circle cx="6" cy="-3" r="2.5" class="paper"/>
    <!-- Warm smile -->
    <path d="M-6 4 Q0 10 6 4" fill="none" stroke="#FEF9F0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Blush -->
    <circle cx="-10" cy="2" r="2.5" fill="#FFF" opacity="0.2"/>
    <circle cx="10" cy="2" r="2.5" fill="#FFF" opacity="0.2"/>
  </g>
  <text x="65" y="140" class="label">大宝 · Amber</text>

  <!-- 小宝 - Planet with small sparkle + playful wink -->
  <g transform="translate(205,95)">
    <circle cx="0" cy="0" r="20" class="rose"/>
    <!-- Small orbiting moon -->
    <circle cx="18" cy="-12" r="3.5" class="rose-lt"/>
    <!-- Wink (one open, one closed) -->
    <circle cx="-5" cy="-2" r="2.2" class="paper"/>
    <path d="M4 -2 L8 -2" stroke="#FEF9F0" stroke-width="2" stroke-linecap="round"/>
    <!-- Playful smile -->
    <path d="M-4 5 Q0 9 6 4" fill="none" stroke="#FEF9F0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Sparkle -->
    <path d="M28 -8 L28.5 -6 L30 -6 L28.5 -5 L29 -3 L28 -4.5 L27 -3 L27.5 -5 L26 -6 L27.5 -6Z" class="mint"/>
  </g>
  <text x="205" y="140" class="label">小宝 · Rose</text>
</svg>
