<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", sans-serif; }
      .title { font-size: 14px; fill: #2D2318; font-weight: bold; }
      .label { font-size: 11px; fill: #9C8E7C; text-anchor: middle; }
      .note { font-size: 10px; fill: #C4B8A8; text-anchor: middle; }
    </style>
  </defs>

  <!-- Pure white background -->
  <rect width="640" height="300" fill="#FFFFFF"/>

  <text x="20" y="24" class="title">小黑方法论启发 — 手绘线稿 · 角色是主体 · 怪诞不幼稚</text>

  <!-- ===== 大宝 (Amber, slightly larger, protective) ===== -->
  <g transform="translate(120,170)">
    <!-- Shadow hint — very subtle -->
    <ellipse cx="0" cy="42" rx="22" ry="5" fill="#E8DCC8" opacity="0.4"/>

    <!-- Body — hand-drawn wobbly circle (slightly irregular) -->
    <path d="M-8-28 Q-4-32 4-31 Q12-30 16-26 Q22-20 24-12 Q26-4 23 5 Q20 14 14 20 Q8 26 2 27 Q-6 28 -10 24 Q-16 18 -19 10 Q-22 2 -20-7 Q-18-16 -14-22 Q-10-28 -8-28Z"
          fill="#E07B3E" fill-opacity="0.85" stroke="#2D2318" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Eye (left) — slightly imperfect circle -->
    <ellipse cx="-5" cy="-4" rx="2.2" ry="2.5" fill="#2D2318"/>
    <!-- Eye (right) — slightly different size -->
    <ellipse cx="7" cy="-5" rx="2.6" ry="2.8" fill="#2D2318"/>
    <!-- Eye white dot — hand-drawn feel -->
    <circle cx="-4" cy="-5" r="0.7" fill="#FFF"/>
    <circle cx="8" cy="-6" r="0.8" fill="#FFF"/>

    <!-- Small protective curl on top (like a small leaf/cap) -->
    <path d="M-2-30 Q0-36 3-34 Q5-30 2-28" fill="#E07B3E" stroke="#2D2318" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Tiny feet -->
    <ellipse cx="-6" cy="28" rx="3" ry="1.8" fill="#2D2318" opacity="0.7"/>
    <ellipse cx="6" cy="28" rx="3" ry="1.8" fill="#2D2318" opacity="0.7"/>
  </g>
  <text x="120" y="240" class="label">大宝 · 琥珀 #E07B3E</text>
  <text x="120" y="254" class="note">稍大 · 有保护的叶子 · 稳重圆眼</text>

  <!-- ===== 小宝 (Rose, slightly smaller, playful) ===== -->
  <g transform="translate(360,175)">
    <ellipse cx="0" cy="38" rx="18" ry="4" fill="#E8DCC8" opacity="0.4"/>

    <!-- Body — wobbly circle, slightly smaller and more irregular -->
    <path d="M-6-24 Q-3-27 3-26 Q9-24 13-20 Q18-14 20-7 Q22 0 20 8 Q17 16 12 20 Q6 24 1 24 Q-5 24 -9 19 Q-14 13 -16 5 Q-18-3 -16-10 Q-14-16 -10-20 Q-6-24 -6-24Z"
          fill="#D48068" fill-opacity="0.85" stroke="#2D2318" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Left eye — slightly squinty (mischievous) -->
    <ellipse cx="-4" cy="-3" rx="2" ry="1.3" fill="#2D2318"/>
    <!-- Right eye — bigger (curious) -->
    <ellipse cx="6" cy="-4" rx="2.3" ry="2.6" fill="#2D2318"/>
    <!-- Eye highlights -->
    <circle cx="-3.5" cy="-3.5" r="0.5" fill="#FFF"/>
    <circle cx="7" cy="-5" r="0.7" fill="#FFF"/>

    <!-- Playful antenna — single wobbly line with dot -->
    <path d="M3-25 Q5-30 7-29 Q9-27 7-24" fill="none" stroke="#2D2318" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="7" cy="-29" r="1.8" fill="none" stroke="#2D2318" stroke-width="1"/>

    <!-- Feet -->
    <ellipse cx="-5" cy="24" rx="2.5" ry="1.5" fill="#2D2318" opacity="0.7"/>
    <ellipse cx="5" cy="24" rx="2.5" ry="1.5" fill="#2D2318" opacity="0.7"/>
  </g>
  <text x="360" y="240" class="label">小宝 · 豆沙 #D48068</text>
  <text x="360" y="254" class="note">稍小 · 俏皮天线 · 大小眼好奇</text>

  <!-- ===== Size comparison row ===== -->
  <g transform="translate(520, 60)">
    <text x="0" y="0" class="note" style="font-size:9px;">64px</text>
    <!-- Small versions -->
    <g transform="translate(0,12) scale(1)">
      <ellipse cx="0" cy="22" rx="12" ry="2.5" fill="#E8DCC8" opacity="0.4"/>
      <path d="M-5-16 Q-2-18 3-17 Q7-15 9-11 Q12-7 13-2 Q14 3 12 8 Q10 13 7 15 Q3 17 0 17 Q-3 17 -6 14 Q-9 10 -11 5 Q-12-1 -10-6 Q-9-10 -7-13Q-5-16-5-16Z"
            fill="#E07B3E" fill-opacity="0.85" stroke="#2D2318" stroke-width="1.5"/>
      <circle cx="-3" cy="-3" r="1.5" fill="#2D2318"/>
      <circle cx="4" cy="-3" r="1.5" fill="#2D2318"/>
      <circle cx="-2.5" cy="-3.5" r="0.5" fill="#FFF"/>
      <circle cx="4.5" cy="-3.5" r="0.5" fill="#FFF"/>
    </g>
  </g>

  <!-- Key methodology notes -->
  <g transform="translate(20,272)">
    <text class="note" style="font-size:9px;">
      小黑方法论：手绘线稿(黑色轮廓+轻微抖动) · 纯色填充(非渐变) · 角色是主体 · 细节克制 · 怪诞不幼稚
    </text>
  </g>
</svg>
