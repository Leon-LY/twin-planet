<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 120">
  <defs><style>
    .label { font-family: -apple-system, sans-serif; font-size: 8px; fill: #9C8E7C; text-anchor: middle; }
    .title { font-size: 10px; font-weight: bold; fill: #2D2318; }
    .amber { fill:#E07B3E } .gold { fill:#C8993E } .rose { fill:#D48068 } .mint { fill:#5C9A6E } .ink { fill:#2D2318 } .paper { fill:#FEF9F0 }
  </style></defs>

  <!-- Variant A: Classic Rainbow Arc (original direction) -->
  <g transform="translate(20,20)">
    <rect width="80" height="80" rx="8" fill="none" stroke="#E8DCC8" stroke-width="1"/>
    <text x="40" y="10" class="label title">A: Rainbow Arc</text>
    <g transform="translate(40,58)">
      <path d="M-18 0 Q-18 -16 0 -18 Q18 -16 18 0" fill="none" stroke="#E07B3E" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-14 0 Q-14 -11 0 -13 Q14 -11 14 0" fill="none" stroke="#C8993E" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-10 0 Q-10 -6 0 -8 Q10 -6 10 0" fill="none" stroke="#5C9A6E" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-18" cy="0" r="2.5" class="amber"/>
    </g>
    <text x="40" y="92" class="label">三色弧线 · 端点星</text>
  </g>

  <!-- Variant B: Lucky Clover Focus -->
  <g transform="translate(120,20)">
    <rect width="80" height="80" rx="8" fill="none" stroke="#E8DCC8" stroke-width="1"/>
    <text x="40" y="10" class="label title">B: Lucky Clover</text>
    <g transform="translate(40,52)">
      <circle cx="0" cy="0" r="8" class="gold" opacity="0.15"/>
      <path d="M0 -8 Q4 -5 0 -1 Q-4 -5 0 -8Z" class="mint"/>
      <path d="M8 0 Q5 4 1 0 Q5 -4 8 0Z" class="mint"/>
      <path d="M0 8 Q-4 5 0 1 Q4 5 0 8Z" class="mint"/>
      <path d="M-8 0 Q-5 -4 -1 0 Q-5 4 -8 0Z" class="mint"/>
      <circle cx="0" cy="0" r="1.8" class="paper"/>
    </g>
    <text x="40" y="92" class="label">四叶幸运草 · 惊喜</text>
  </g>

  <!-- Variant C: Sparkle Burst -->
  <g transform="translate(220,20)">
    <rect width="80" height="80" rx="8" fill="none" stroke="#E8DCC8" stroke-width="1"/>
    <text x="40" y="10" class="label title">C: Sparkle Burst</text>
    <g transform="translate(40,52)">
      <path d="M0 -16 L1 -5 L3 -2 L14 -3 L5 1 L3 5 L4 16 L0 7 L-4 16 L-3 5 L-5 1 L-14 -3 L-3 -2 L-1 -5Z" class="gold" opacity="0.5"/>
      <path d="M0 -10 L1 -3 L2 -1 L9 -2 L3 1 L2 3 L2 10 L0 4 L-2 10 L-2 3 L-3 1 L-9 -2 L-2 -1 L-1 -3Z" class="amber" opacity="0.6"/>
      <circle cx="0" cy="0" r="2" class="mint"/>
    </g>
    <text x="40" y="92" class="label">星光迸发 · 双层闪烁</text>
  </g>

  <!-- Variant D: Color Drops -->
  <g transform="translate(320,20)">
    <rect width="80" height="80" rx="8" fill="none" stroke="#E8DCC8" stroke-width="1"/>
    <text x="40" y="10" class="label title">D: Rainbow Drops</text>
    <g transform="translate(40,52)">
      <circle cx="-10" cy="-6" r="4" class="amber" opacity="0.8"/>
      <circle cx="0" cy="-10" r="3.5" class="gold" opacity="0.8"/>
      <circle cx="10" cy="-6" r="4" class="rose" opacity="0.8"/>
      <circle cx="8" cy="5" r="3.5" class="mint" opacity="0.8"/>
      <circle cx="-8" cy="5" r="3.5" class="amber" opacity="0.5"/>
      <circle cx="0" cy="0" r="2" class="paper"/>
    </g>
    <text x="40" y="92" class="label">彩色水滴 · 缤纷散落</text>
  </g>
</svg>
