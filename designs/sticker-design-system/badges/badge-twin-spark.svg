<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="twin-spark-title">
  <title id="twin-spark-title">双宝活跃 — 两个宝宝都在活跃</title>
  <desc>Two interlocking circles representing twin babies orbiting together. currentColor for iconfont compatibility.</desc>
  <!-- Twin interlocking circles — "并蒂而生" (born together, grow together) -->
  <circle cx="8.5" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="15.5" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- Center overlap — where the twins connect -->
  <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
  <!-- Inner connection line -->
  <path d="M8.5 12 L15.5 12" stroke="#FEF9F0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small orbit dots for "active" feel -->
  <circle cx="5" cy="8" r="0.8" fill="currentColor"/>
  <circle cx="19" cy="16" r="0.8" fill="currentColor"/>
</svg>
