<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="three-title">
  <title id="three-title">三日连续 — 连续记录3天</title>
  <desc>Three ascending bars representing a 3-day streak. Mint #5C9A6E. Journal ink-pen stroke style.</desc>
  <!-- Three filled bars ascending left to right -->
  <rect x="3" y="12" width="5" height="9" rx="1.5" fill="currentColor" opacity="0.6"/>
  <rect x="9.5" y="7" width="5" height="14" rx="1.5" fill="currentColor" opacity="0.85"/>
  <rect x="16" y="3" width="5" height="18" rx="1.5" fill="currentColor"/>
  <!-- Small connector dots between bars -->
  <circle cx="8" cy="19" r="0.8" fill="#FEF9F0"/>
  <circle cx="14.5" cy="18" r="0.8" fill="#FEF9F0"/>
</svg>
