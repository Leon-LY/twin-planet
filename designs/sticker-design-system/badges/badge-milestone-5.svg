<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="milestone5-title">
  <title id="milestone5-title">五个里程碑 — 达成5个能力里程碑</title>
  <desc>Five ascending pillars forming a staircase of achievement. Amber #E07B3E. Ink-stamp style with visible count.</desc>
  <!-- Five ascending pillars — clearly visible at any size, natural metaphor for progress -->
  <rect x="2" y="18" width="3.5" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="6" y="14" width="3.5" height="8" rx="1" fill="currentColor" opacity="0.55"/>
  <rect x="10" y="10" width="3.5" height="12" rx="1" fill="currentColor" opacity="0.7"/>
  <rect x="14" y="6" width="3.5" height="16" rx="1" fill="currentColor" opacity="0.85"/>
  <rect x="18" y="2" width="3.5" height="20" rx="1" fill="currentColor"/>
  <!-- Star at the peak of the 5th pillar -->
  <circle cx="19.75" cy="2" r="1.2" fill="#FEF9F0"/>
</svg>
