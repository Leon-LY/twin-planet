<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Asset Generator</title></head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ================================================================
// 1. Twin Mascot (400x200)
// ================================================================
function drawMascot(x, y, r, color, faceExpr) {
  // Planet body
  const grad = ctx.createRadialGradient(x-r*0.25, y-r*0.3, r*0.1, x, y, r);
  grad.addColorStop(0, color);
  grad.addColorStop(0.7, color+'88');
  grad.addColorStop(1, color+'44');
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = grad; ctx.fill();

  // Outline — hand-drawn wobble
  ctx.beginPath();
  for (let i=0; i<60; i++) {
    const a = (i/60)*Math.PI*2;
    const rr = r + Math.sin(i*7)*1.5 + Math.cos(i*11)*1;
    const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
    i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();

  // Face
  ctx.fillStyle = '#2C2416';
  // Eyes
  ctx.beginPath(); ctx.arc(x-r*0.25, y-r*0.1, r*0.08, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.25, y-r*0.1, r*0.08, 0, Math.PI*2); ctx.fill();
  // Eye shine
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(x-r*0.25-r*0.03, y-r*0.1-r*0.03, r*0.03, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.25-r*0.03, y-r*0.1-r*0.03, r*0.03, 0, Math.PI*2); ctx.fill();

  // Mouth
  ctx.fillStyle = '#2C2416';
  if (faceExpr === 'smile') {
    ctx.beginPath(); ctx.arc(x, y+r*0.05, r*0.15, 0.1*Math.PI, 0.9*Math.PI); ctx.strokeStyle='#2C2416'; ctx.lineWidth=2; ctx.stroke();
  } else if (faceExpr === 'sleep') {
    ctx.beginPath(); ctx.ellipse(x, y+r*0.1, r*0.1, r*0.05, 0, 0, Math.PI*2); ctx.fill();
  } else if (faceExpr === 'tongue') {
    ctx.beginPath(); ctx.arc(x, y+r*0.05, r*0.12, 0, Math.PI); ctx.strokeStyle='#2C2416'; ctx.lineWidth=2; ctx.stroke();
    // tongue
    ctx.fillStyle = '#E8824A';
    ctx.beginPath(); ctx.ellipse(x, y+r*0.15, r*0.06, r*0.08, 0, 0, Math.PI*2); ctx.fill();
  }

  // Cheek blush
  ctx.fillStyle = color+'33';
  ctx.beginPath(); ctx.ellipse(x-r*0.4, y+r*0.1, r*0.1, r*0.07, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+r*0.4, y+r*0.1, r*0.1, r*0.07, 0, 0, Math.PI*2); ctx.fill();
}

// Draw twin mascots
ctx.clearRect(0,0,800,600);
drawMascot(200, 200, 80, '#E8824A', 'tongue');
drawMascot(500, 200, 75, '#D4856B', 'smile');

// Small hearts between them
ctx.fillStyle = '#E8824A44';
for (let i=0; i<3; i++) {
  const hx = 340 + i*20, hy = 180 + i*15;
  ctx.font = '18px serif'; ctx.fillText('♥', hx, hy);
}

// Labels
ctx.fillStyle = '#2C2416'; ctx.font = 'bold 22px Georgia, serif';
ctx.textAlign = 'center';
ctx.fillText('安 宁', 200, 310);
ctx.fillText('安 然', 500, 310);
ctx.fillStyle = '#8C7E6B'; ctx.font = '14px PingFang SC, sans-serif';
ctx.fillText('大宝 · 深陶土', 200, 335);
ctx.fillText('二宝 · 浅陶土', 500, 335);

// Save
const a1 = document.createElement('a');
a1.download = 'twin-mascot.png';
a1.href = cv.toDataURL('image/png');
a1.click();

// ================================================================
// 2. Action Icons (32x32 each, in a 200x40 strip)
// ================================================================
setTimeout(() => {
  ctx.clearRect(0,0,800,600);
  ctx.fillStyle = '#FFFBF2'; ctx.fillRect(0,0,800,600);

  const icons = [
    { label:'feed', emoji:'🍼', x:10, y:10 },
    { label:'sleep', emoji:'😴', x:50, y:10 },
    { label:'diaper', emoji:'🧷', x:90, y:10 },
    { label:'temp', emoji:'🌡️', x:130, y:10 },
    { label:'med', emoji:'💊', x:170, y:10 },
    { label:'bath', emoji:'🛁', x:210, y:10 },
  ];
  icons.forEach(ic => {
    ctx.font = '28px serif';
    ctx.fillText(ic.emoji, ic.x, ic.y+24);
  });

  const a2 = document.createElement('a');
  a2.download = 'action-icons.png';
  a2.href = cv.toDataURL('image/png');
  a2.click();
}, 500);

// ================================================================
// 3. Connection Pattern (dots + hearts, 200x40)
// ================================================================
setTimeout(() => {
  ctx.clearRect(0,0,800,600);
  ctx.fillStyle = '#FFFBF2'; ctx.fillRect(0,0,800,600);

  // Dots
  for (let i=0; i<8; i++) {
    ctx.beginPath(); ctx.arc(20+i*22, 20, 3, 0, Math.PI*2);
    ctx.fillStyle = i===3 ? '#E8824A' : '#E8E0D4'; ctx.fill();
  }
  // Heart
  ctx.font = '16px serif'; ctx.fillStyle = '#E8824A88'; ctx.fillText('♥', 150, 25);
  // More dots
  for (let i=0; i<6; i++) {
    ctx.beginPath(); ctx.arc(175+i*22, 20, 3, 0, Math.PI*2);
    ctx.fillStyle = i===2 ? '#D4856B' : '#E8E0D4'; ctx.fill();
  }

  const a3 = document.createElement('a');
  a3.download = 'connection-pattern.png';
  a3.href = cv.toDataURL('image/png');
  a3.click();
}, 1000);
</script>
</body></html>
