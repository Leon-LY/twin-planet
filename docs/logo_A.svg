<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FFFBF5" rx="60"/>
  <!-- 外圈 -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#4299E1" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#F56565" stroke-opacity="0.08" stroke-width="1"/>
  <!-- 蓝色椭圆 -->
  <ellipse cx="170" cy="200" rx="62" ry="105" fill="#4299E1"/>
  <!-- 蓝色高光 -->
  <ellipse cx="163" cy="175" rx="20" ry="50" fill="#FFFFFF" fill-opacity="0.2"/>
  <!-- 粉色椭圆 -->
  <ellipse cx="230" cy="200" rx="62" ry="105" fill="#F56565"/>
  <!-- 粉色高光 -->
  <ellipse cx="237" cy="175" rx="20" ry="50" fill="#FFFFFF" fill-opacity="0.2"/>
  <!-- 中间分隔 -->
  <line x1="200" y1="100" x2="200" y2="300" stroke="#FFFBF5" stroke-width="2.5"/>
  <!-- 标签 -->
  <text x="200" y="370" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#A0AEC0" font-weight="300">方案A · 极简几何</text>
</svg>
