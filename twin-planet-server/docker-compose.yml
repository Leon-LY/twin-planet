# 并蒂星球 · 后端服务
# 部署到 49.232.49.175，端口 3003（避免与 investlearn/studio 冲突）
# PostgreSQL 和 Redis 复用 investlearn 项目的现有容器

services:
  api:
    build: .
    container_name: twin-planet-api
    ports:
      - "3003:3000"
    environment:
      - DATABASE_URL=postgresql://twin_planet_user:tp_dev_2026@investlearn-db:5432/twin_planet
      - REDIS_URL=redis://investlearn-redis:6379/2
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - WECHAT_APPID=${WECHAT_APPID:-wxee2ef767a77058db}
      - WECHAT_SECRET=${WECHAT_SECRET:-}
    networks:
      - default
      - deploy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  deploy:
    external: true
    name: deploy_default
