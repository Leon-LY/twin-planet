<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400, initial-scale=1.0">
<title>双宝手帐 · 品牌分享卡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 400px; height: 320px; overflow: hidden;
  background: #FEF9F0;
  font-family: Georgia, KaiTi, STKaiti, "PingFang SC", "Microsoft YaHei", serif;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.card {
  width: 360px; height: 280px;
  border: 2px dashed #E8DCC8;
  border-radius: 2px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.stamp {
  width: 96px; height: 96px; border-radius: 50%;
  background: #E07B3E;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.stamp-text { color: #FFF; font-size: 46px; font-weight: bold; font-family: KaiTi, STKaiti, serif; }
.title { color: #2D2318; font-size: 30px; font-weight: bold; margin-bottom: 8px; }
.subtitle { color: #9C8E7C; font-size: 16px; }
.bar-a { position: absolute; bottom: 0; left: 0; width: 200px; height: 20px; background: #E07B3E; }
.bar-b { position: absolute; bottom: 0; right: 0; width: 200px; height: 20px; background: #D48068; }
</style>
</head>
<body>
<div class="card">
  <div class="stamp"><span class="stamp-text">双</span></div>
  <div class="title">双宝手帐</div>
  <div class="subtitle">双胞胎的成长记录本</div>
</div>
<div class="bar-a"></div><div class="bar-b"></div>
</body>
</html>
